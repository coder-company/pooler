version: 2

# Universal turnkey gateway.
#
# This preset mounts the endpoint families a general OpenAI/Anthropic/Gemini
# client expects, using only route primitives that already exist. It makes one
# claim and no more: every route below is mounted, bounded, and reachable.
#
# Two honest modes are used.
#
#   patch   The caller's JSON body is preserved except for the `/model`
#           pointer, which is rewritten to the selected target's upstream
#           model. This is what makes catalog aliases, account pooling,
#           capability filtering, and the vendored request-facts dialect apply
#           to a request. It requires a JSON body with a top-level `model`,
#           and it only accepts a model the catalog knows.
#
# The upstream is declared with `known_provider`, so its base URL, discovery
# parser, model aliases, and model exclusions come from the provider catalog
# this build ships. That is what makes the preset turnkey: Pooler derives a
# model catalog for the upstream automatically, and the patch routes above
# select against it. Set `upstream_url` to override the shipped base URL.
#
#   opaque  Bytes or frames are forwarded without semantic decoding. Media,
#           file, and batch surfaces keep provider-specific fields exactly, and
#           upload bytes are streamed once so Pooler's retry policy cannot
#           replay them.
#
# Opaque forwarding is NOT provider-native semantic compatibility. A route here
# never claims to translate between protocols; routes that do that are
# configured explicitly with a decoder and encoder.

listeners:
  gateway:
    bind: 127.0.0.1:8400

upstreams:
  gateway:
    known_provider: openai
    # Only the protected credential reference is overridden here. The
    # authentication kind, header name, and value prefix stay with the
    # provider, so pointing this preset at Anthropic or Gemini sends
    # `x-api-key` or the documented Google key placement rather than a bearer
    # token.
    auth:
      secret: env:POOLER_GATEWAY_KEY
  # A WebSocket route requires an explicit ws/wss transport, so this upstream
  # cannot be derived from `known_provider`. Set the preset's `websocket_url`
  # parameter whenever `provider` is not `openai`.
  gateway-websocket:
    known_provider: openai
    url: wss://api.openai.com
    auth:
      secret: env:POOLER_GATEWAY_KEY

routes:
  # ---------------------------------------------------------------- discovery
  - id: models
    listen: gateway
    match:
      methods: [GET]
      path: /v1/models
    limits:
      max_request_body_bytes: 65536
    # Pooler answers this from its own active model view rather than forwarding
    # the upstream list, so aliases, exclusions, runtime enablement, account
    # eligibility, and provider health all apply. The target scopes the view.
    serve: model_catalog
    ingress:
      mode: opaque
    target:
      endpoint_family: models
      provider: gateway
    response:
      mode: opaque

  # ------------------------------------------------------- OpenAI text family
  - id: chat-completions
    listen: gateway
    match:
      methods: [POST]
      path: /v1/chat/completions
      content_types: [application/json]
    limits:
      max_request_body_bytes: 8388608
      max_frame_bytes: 8388608
      max_event_bytes: 8388608
      max_queue_bytes: 8388608
      max_queue_items: 256
    ingress:
      mode: patch
      inspectors: [inspect.openai.model]
    target:
      endpoint_family: chat_completions
      provider: gateway
      model_from: request.model
    response:
      mode: opaque

  # The legacy Completions and Embeddings JSON surfaces remain same-wire. Pooler
  # rewrites only the selected model while preserving provider-specific fields.
  - id: completions
    listen: gateway
    match:
      methods: [POST]
      path: /v1/completions
      content_types: [application/json]
    limits:
      max_request_body_bytes: 8388608
      max_frame_bytes: 8388608
    ingress:
      mode: patch
      inspectors: [inspect.openai.model]
    target:
      endpoint_family: completions
      provider: gateway
      model_from: request.model
      capabilities: [text]
    response:
      mode: opaque

  - id: embeddings
    listen: gateway
    match:
      methods: [POST]
      path: /v1/embeddings
      content_types: [application/json]
    limits:
      max_request_body_bytes: 8388608
      max_frame_bytes: 8388608
    ingress:
      mode: patch
      inspectors: [inspect.openai.model]
    target:
      endpoint_family: embeddings
      provider: gateway
      model_from: request.model
    response:
      mode: opaque

  # File uploads are streamed once and are never replayed. Collection and
  # resource routes are separate so unsupported methods fail before upstream.
  - id: files-list
    listen: gateway
    match:
      methods: [GET]
      path: /v1/files
    limits:
      max_request_body_bytes: 65536
    ingress:
      mode: opaque
    target:
      endpoint_family: files
      provider: gateway
      capabilities: [files]
    response:
      mode: opaque

  - id: files-create
    listen: gateway
    match:
      methods: [POST]
      path: /v1/files
      content_types: [multipart/form-data]
    limits:
      max_request_body_bytes: 67108864
      max_frame_bytes: 67108864
    ingress:
      mode: opaque
    target:
      endpoint_family: files
      provider: gateway
      capabilities: [files]
    response:
      mode: opaque

  - id: files-content
    listen: gateway
    match:
      methods: [GET]
      path_template: /v1/files/{file_id}/content
    limits:
      max_request_body_bytes: 65536
    ingress:
      mode: opaque
    target:
      endpoint_family: files
      provider: gateway
      capabilities: [files]
    response:
      mode: opaque

  - id: files-resource
    listen: gateway
    match:
      methods: [GET, DELETE]
      path_template: /v1/files/{file_id}
    limits:
      max_request_body_bytes: 65536
    ingress:
      mode: opaque
    target:
      endpoint_family: files
      provider: gateway
      capabilities: [files]
    response:
      mode: opaque

  # Batch collection, retrieval, and cancellation are mounted as strict paths;
  # arbitrary POST requests below `/v1/batches/` are not accepted.
  - id: batches-list
    listen: gateway
    match:
      methods: [GET]
      path: /v1/batches
    limits:
      max_request_body_bytes: 65536
    ingress:
      mode: opaque
    target:
      endpoint_family: batches
      provider: gateway
      capabilities: [batch]
    response:
      mode: opaque

  - id: batches-create
    listen: gateway
    match:
      methods: [POST]
      path: /v1/batches
      content_types: [application/json]
    limits:
      max_request_body_bytes: 1048576
      max_frame_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: batches
      provider: gateway
      capabilities: [batch]
    response:
      mode: opaque

  - id: batches-cancel
    listen: gateway
    match:
      methods: [POST]
      path_template: /v1/batches/{batch_id}/cancel
    limits:
      max_request_body_bytes: 65536
    ingress:
      mode: opaque
    target:
      endpoint_family: batches
      provider: gateway
      capabilities: [batch]
    response:
      mode: opaque

  - id: batches-resource
    listen: gateway
    match:
      methods: [GET]
      path_template: /v1/batches/{batch_id}
    limits:
      max_request_body_bytes: 65536
    ingress:
      mode: opaque
    target:
      endpoint_family: batches
      provider: gateway
      capabilities: [batch]
    response:
      mode: opaque

  # REST callers use Pooler's semantic Responses transport. Pooler selects and
  # authenticates an account, sends `response.create` over the provider's
  # bounded WebSocket, and returns a validated Responses SSE stream. Connections
  # are reusable only inside an explicit downstream session identity.
  - id: responses
    listen: gateway
    match:
      methods: [POST]
      path: /v1/responses
      content_types: [application/json]
    limits:
      max_request_body_bytes: 8388608
      max_frame_bytes: 8388608
      max_event_bytes: 8388608
      max_queue_bytes: 8388608
      max_queue_items: 256
    ingress:
      mode: semantic
      decoder: decode.openai.responses
      encoder: encode.openai.responses
    target:
      endpoint_family: responses
      # Model selection belongs to the REST upstream so automatic discovery
      # can resolve public aliases. The explicit transport binding below is
      # used only after selection commits.
      provider: gateway
      transport_upstream: gateway-websocket
      path: /v1/responses
    response:
      mode: semantic
      decoder: decode.openai.responses.events
      encoder: encode.openai.responses.events
    loss_policy: reject

  - id: responses-compact
    listen: gateway
    match:
      methods: [POST]
      path: /v1/responses/compact
      content_types: [application/json]
    limits:
      max_request_body_bytes: 8388608
      max_frame_bytes: 8388608
    ingress:
      mode: patch
      inspectors: [inspect.openai.model]
    target:
      endpoint_family: responses_compact
      provider: gateway
      model_from: request.model
    response:
      mode: opaque

  # Provider-native image endpoints keep bounded media requests and the
  # provider's response wire unchanged. Edits are validated losslessly as
  # multipart; generations remain opaque JSON because their fields are
  # provider-specific.
  - id: image-generations
    listen: gateway
    match:
      methods: [POST]
      path: /v1/images/generations
      content_types: [application/json]
    limits:
      max_request_body_bytes: 33554432
      max_frame_bytes: 33554432
    ingress:
      mode: opaque
    target:
      endpoint_family: image_generations
      provider: gateway
      capabilities: [images]
    response:
      mode: opaque

  - id: image-edits
    listen: gateway
    match:
      methods: [POST]
      path: /v1/images/edits
      content_types: [multipart/form-data]
    limits:
      max_request_body_bytes: 33554432
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.media.multipart
    target:
      endpoint_family: image_edits
      provider: gateway
      capabilities: [text, images, files]
      codecs: [decode.media.multipart]
    response:
      mode: opaque

  # Provider-native audio transcription keeps multipart fields and the
  # provider response wire unchanged while applying bounded media validation.
  - id: audio-transcriptions
    listen: gateway
    match:
      methods: [POST]
      path: /v1/audio/transcriptions
      content_types: [multipart/form-data]
    limits:
      max_request_body_bytes: 33554432
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.media.multipart
    target:
      endpoint_family: audio_transcriptions
      provider: gateway
      capabilities: [text, audio, input_audio, files]
      codecs: [decode.media.multipart]
    response:
      mode: opaque

  # ------------------------------------------------------- OpenAI video family
  # The installed OpenAI SDK 6.40.0 uses multipart for create/edit/extend,
  # JSON for remix, and caller-driven GET/DELETE resource operations. These
  # routes preserve provider-specific fields and keep all bodies bounded.
  - id: video-creations
    listen: gateway
    match:
      methods: [POST]
      path: /v1/videos
      content_types: [multipart/form-data]
    limits:
      max_request_body_bytes: 33554432
      max_response_body_bytes: 1048576
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.media.multipart
    target:
      endpoint_family: video_creations
      provider: gateway
      capabilities: [text, images, files]
      codecs: [decode.media.multipart]
    response:
      mode: opaque

  - id: video-edits
    listen: gateway
    match:
      methods: [POST]
      path: /v1/videos/edits
      content_types: [multipart/form-data]
    limits:
      max_request_body_bytes: 33554432
      max_response_body_bytes: 1048576
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.media.multipart
    target:
      endpoint_family: video_edits
      provider: gateway
      capabilities: [text, files]
      codecs: [decode.media.multipart]
    response:
      mode: opaque

  - id: video-extensions
    listen: gateway
    match:
      methods: [POST]
      path: /v1/videos/extensions
      content_types: [multipart/form-data]
    limits:
      max_request_body_bytes: 33554432
      max_response_body_bytes: 1048576
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.media.multipart
    target:
      endpoint_family: video_extensions
      provider: gateway
      capabilities: [text, files]
      codecs: [decode.media.multipart]
    response:
      mode: opaque

  - id: video-remixes
    listen: gateway
    match:
      methods: [POST]
      path_template: "/v1/videos/{video_id}/remix"
      content_types: [application/json]
    limits:
      max_request_body_bytes: 1048576
      max_response_body_bytes: 1048576
      max_frame_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: video_remixes
      provider: gateway
      capabilities: [text]
    response:
      mode: opaque

  - id: video-retrieval
    listen: gateway
    match:
      methods: [GET]
      path_template: "/v1/videos/{video_id}"
    limits:
      max_request_body_bytes: 65536
      max_response_body_bytes: 1048576
      max_frame_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: video_retrieval
      provider: gateway
    response:
      mode: opaque

  - id: video-content
    listen: gateway
    match:
      methods: [GET]
      path_template: "/v1/videos/{video_id}/content"
      headers:
        accept: application/binary
    limits:
      max_request_body_bytes: 65536
      max_response_body_bytes: 268435456
      max_frame_bytes: 33554432
    ingress:
      mode: opaque
    target:
      endpoint_family: video_content
      provider: gateway
    response:
      mode: opaque

  - id: video-deletions
    listen: gateway
    match:
      methods: [DELETE]
      path_template: "/v1/videos/{video_id}"
    limits:
      max_request_body_bytes: 65536
      max_response_body_bytes: 1048576
      max_frame_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: video_deletions
      provider: gateway
    response:
      mode: opaque

  # GA client secrets and the deprecated session creation endpoints are kept
  # as distinct same-wire families. The latter two require the SDK's beta
  # header from the caller; Pooler does not synthesize undocumented variants.
  - id: realtime-client-secrets
    listen: gateway
    match:
      methods: [POST]
      path: /v1/realtime/client_secrets
      content_types: [application/json]
    limits:
      max_request_body_bytes: 1048576
      max_response_body_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: realtime_client_secrets
      provider: gateway
    response:
      mode: opaque

  - id: realtime-sessions
    listen: gateway
    match:
      methods: [POST]
      path: /v1/realtime/sessions
      headers:
        openai-beta: assistants=v2
      content_types: [application/json]
    limits:
      max_request_body_bytes: 1048576
      max_response_body_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: realtime_sessions
      provider: gateway
    response:
      mode: opaque

  - id: realtime-transcription-sessions
    listen: gateway
    match:
      methods: [POST]
      path: /v1/realtime/transcription_sessions
      headers:
        openai-beta: assistants=v2
      content_types: [application/json]
    limits:
      max_request_body_bytes: 1048576
      max_response_body_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: realtime_transcription_sessions
      provider: gateway
    response:
      mode: opaque

  # SIP call controls intentionally use four exact action templates. A broad
  # calls prefix would advertise undocumented actions.
  - id: realtime-calls-accept
    listen: gateway
    match:
      methods: [POST]
      path_template: "/v1/realtime/calls/{call_id}/accept"
      content_types: [application/json]
    limits:
      max_request_body_bytes: 1048576
      max_response_body_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: realtime_calls
      provider: gateway
    response:
      mode: opaque

  - id: realtime-calls-reject
    listen: gateway
    match:
      methods: [POST]
      path_template: "/v1/realtime/calls/{call_id}/reject"
      content_types: [application/json]
    limits:
      max_request_body_bytes: 1048576
      max_response_body_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: realtime_calls
      provider: gateway
    response:
      mode: opaque

  - id: realtime-calls-refer
    listen: gateway
    match:
      methods: [POST]
      path_template: "/v1/realtime/calls/{call_id}/refer"
      content_types: [application/json]
    limits:
      max_request_body_bytes: 1048576
      max_response_body_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: realtime_calls
      provider: gateway
    response:
      mode: opaque

  - id: realtime-calls-hangup
    listen: gateway
    match:
      methods: [POST]
      path_template: "/v1/realtime/calls/{call_id}/hangup"
    limits:
      max_request_body_bytes: 65536
      max_response_body_bytes: 1048576
    ingress:
      mode: opaque
    target:
      endpoint_family: realtime_calls
      provider: gateway
    response:
      mode: opaque

  # Both ordinary model sessions and SIP sideband sessions use this endpoint.
  # The query (`model=...` or `call_id=...`) is preserved by the WebSocket
  # tunnel rather than split into a second route.
  - id: realtime-websocket
    listen: gateway
    match:
      methods: [GET]
      path: /v1/realtime
      websocket: true
    limits:
      max_frame_bytes: 8388608
      max_queue_bytes: 8388608
      max_queue_items: 64
      request_timeout: 1h
    ingress:
      mode: semantic
      decoder: decode.openai.realtime.client
    target:
      endpoint_family: realtime
      provider: gateway-websocket
      path: /v1/realtime
    response:
      mode: semantic
      decoder: decode.openai.realtime.events
    loss_policy: reject

  # Native WebSocket clients may still use the same-wire upgrade surface. The
  # semantic, pooled transport above is the default for ordinary REST callers;
  # this route remains a bounded provider-wire tunnel rather than a translation.
  - id: responses-websocket
    listen: gateway
    match:
      methods: [GET]
      path: /v1/responses
      websocket: true
    limits:
      max_frame_bytes: 8388608
      max_queue_bytes: 8388608
      max_queue_items: 256
    ingress:
      mode: opaque
    target:
      endpoint_family: responses
      provider: gateway-websocket
      capabilities: [web_socket]
    response:
      mode: opaque

  - id: messages
    listen: gateway
    match:
      methods: [POST]
      path: /v1/messages
      content_types: [application/json]
    limits:
      max_request_body_bytes: 8388608
      max_frame_bytes: 8388608
      max_event_bytes: 8388608
      max_queue_bytes: 8388608
      max_queue_items: 256
    ingress:
      mode: patch
      inspectors: [inspect.openai.model]
    target:
      endpoint_family: messages
      provider: gateway
      model_from: request.model
    response:
      mode: opaque

  - id: messages-count-tokens
    listen: gateway
    match:
      methods: [POST]
      path: /v1/messages/count_tokens
      content_types: [application/json]
    limits:
      max_request_body_bytes: 8388608
      max_frame_bytes: 8388608
    ingress:
      mode: patch
      inspectors: [inspect.openai.model]
    target:
      endpoint_family: messages
      provider: gateway
      model_from: request.model
    response:
      mode: opaque

  # ------------------------------------------------------------- Gemini family
  # Gemini carries model identifiers in model-action paths. Semantic ingress
  # validates the exact documented operation and supplies the model and request
  # capabilities to normal alias, account, and policy selection. Responses stay
  # same-wire because the client and provider already speak Gemini JSON/SSE.
  - id: gemini-models
    listen: gateway
    match:
      methods: [GET]
      path: /v1beta/models
    limits:
      max_request_body_bytes: 65536
    ingress:
      mode: opaque
    target:
      endpoint_family: models
      provider: gateway
    response:
      mode: opaque

  - id: gemini-model-get
    listen: gateway
    match:
      methods: [GET]
      path_template: "/v1beta/models/{model}"
    limits:
      max_request_body_bytes: 65536
      max_frame_bytes: 8388608
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: models
      provider: gateway
    response:
      mode: opaque

  - id: gemini-model-actions
    listen: gateway
    match:
      methods: [POST]
      path_template: "/v1beta/models/{model_action}"
      content_types: [application/json]
    limits:
      max_request_body_bytes: 33554432
      max_frame_bytes: 33554432
      max_event_bytes: 8388608
      max_queue_bytes: 8388608
      max_queue_items: 256
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: generate_content
      provider: gateway
    response:
      mode: opaque

  # Both official Interactions versions are mounted. v1/v1beta are the current
  # reference surfaces; v1beta2 is retained for the documented migration path.
  # Resource IDs become affinity inputs for an operator-supplied pooling policy.
  # Opaque responses do not bind a newly returned ID to the creating account.
  - id: gemini-interactions-v1-create
    listen: gateway
    match:
      methods: [POST]
      path: /v1/interactions
      content_types: [application/json]
    limits:
      max_request_body_bytes: 33554432
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: interactions
      provider: gateway
    response:
      mode: opaque

  - id: gemini-interactions-v1-resources
    listen: gateway
    match:
      methods: [GET, DELETE]
      path_template: "/v1/interactions/{interaction}"
    limits:
      max_request_body_bytes: 65536
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: interactions
      provider: gateway
    response:
      mode: opaque

  - id: gemini-interactions-v1-cancel
    listen: gateway
    match:
      methods: [POST]
      path_template: "/v1/interactions/{interaction}/cancel"
    limits:
      max_request_body_bytes: 65536
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: interactions
      provider: gateway
    response:
      mode: opaque

  - id: gemini-interactions-v1beta-create
    listen: gateway
    match:
      methods: [POST]
      path: /v1beta/interactions
      content_types: [application/json]
    limits:
      max_request_body_bytes: 33554432
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: interactions
      provider: gateway
    response:
      mode: opaque

  - id: gemini-interactions-v1beta-resources
    listen: gateway
    match:
      methods: [GET, DELETE]
      path_template: "/v1beta/interactions/{interaction}"
    limits:
      max_request_body_bytes: 65536
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: interactions
      provider: gateway
    response:
      mode: opaque

  - id: gemini-interactions-v1beta-cancel
    listen: gateway
    match:
      methods: [POST]
      path_template: "/v1beta/interactions/{interaction}/cancel"
    limits:
      max_request_body_bytes: 65536
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: interactions
      provider: gateway
    response:
      mode: opaque

  - id: gemini-interactions-v1beta2-create
    listen: gateway
    match:
      methods: [POST]
      path: /v1beta2/interactions
      content_types: [application/json]
    limits:
      max_request_body_bytes: 33554432
      max_frame_bytes: 33554432
    ingress:
      mode: semantic
      decoder: decode.gemini.generate_content
    target:
      endpoint_family: interactions
      provider: gateway
    response:
