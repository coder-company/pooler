name: Hardening

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or commit to verify
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  failure-and-security:
    name: Failure injection and security boundaries
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # pinned action; toolchain below
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/deep-test.sh --no-fuzz

  fuzz:
    name: Bounded parser fuzzing
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: >-
          RUSTUP_TOOLCHAIN=nightly POOLER_FUZZ_TOOLCHAIN=nightly
          POOLER_REQUIRE_FUZZ=1
          POOLER_FUZZ_SECONDS=10 POOLER_FUZZ_TIMEOUT=45
          scripts/deep-test.sh

  benchmark-smoke:
    name: Short benchmark and stress smoke
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # pinned action; toolchain below
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run bounded smoke workload
        shell: bash
        run: >-
          cargo run --locked --release -p pooler-bench --
          --mode all --short --runs 1 --json
          --output "$RUNNER_TEMP/pooler-benchmark-smoke.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-smoke-report
          path: ${{ runner.temp }}/pooler-benchmark-smoke.json
          if-no-files-found: error

  sanitizer:
    name: Nightly sanitizer checks
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: >-
          POOLER_REQUIRE_SANITIZER=1 POOLER_SANITIZER=address
          scripts/deep-test.sh --sanitize --no-fuzz
