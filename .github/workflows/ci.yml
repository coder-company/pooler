name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or commit to verify
        required: false
        type: string
      include-macos:
        description: Run the macOS quality lane when matching self-hosted capacity exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality (Linux)
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      # Action references are immutable commit pins. Dependabot updates them
      # weekly after checking the corresponding release tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # pinned action; toolchain below
        with:
          toolchain: 1.86.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: bash scripts/check-release-workflow.sh
      - run: ./scripts/check-config-schema.sh
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked --doc

  quality-macos:
    name: Quality (macOS)
    if: ${{ inputs.include-macos }}
    runs-on: [self-hosted, macOS, X64, palantir-actions]
    steps:
      # Action references are immutable commit pins. Dependabot updates them
      # weekly after checking the corresponding release tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # pinned action; toolchain below
        with:
          toolchain: 1.86.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo fmt --all --check
      - run: bash scripts/check-release-workflow.sh
      - run: ./scripts/check-config-schema.sh
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked --doc

  fixtures-and-properties:
    name: Fixtures and property harnesses
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # pinned action; toolchain below
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features --locked -- --test-threads=1
      - run: ./scripts/verify-compatibility-fixtures.py
      - run: cargo test --manifest-path fuzz/Cargo.toml --locked --no-run
      - run: >-
          cargo run --locked -p pooler-cli -- fixture report
          --manifest fixtures/compatibility/manifest.json
          --format markdown
          --output "$RUNNER_TEMP/compatibility.md"
      - run: diff -u fixtures/compatibility/MATRIX.md "$RUNNER_TEMP/compatibility.md"

  supply-chain:
    name: Dependency and license policy
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # action implementation
        with:
          # cargo metadata must parse Rust-2024 target-only dependencies such
          # as security-framework; keep the product MSRV separate from the
          # toolchain used solely for dependency auditing.
          toolchain: 1.86.0
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock
      - run: cargo deny check
