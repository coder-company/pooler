name: Secret scan

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or commit to verify
        required: false
        type: string
    secrets:
      GITHUB_TOKEN:
        description: Token used by the Gitleaks action for repository metadata
        required: true

permissions:
  contents: read
  pull-requests: read # Gitleaks reads pull-request metadata when scanning PRs.

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
