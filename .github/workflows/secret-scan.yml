name: Secret scan

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or commit to verify
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read # Gitleaks reads pull-request metadata when scanning PRs.

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - name: Install the open-source Gitleaks CLI
        uses: taiki-e/install-action@5abf6c01b17e9f0f603b362b08d3113b1a76f064 # v2.57.5
        with:
          tool: gitleaks@8.24.2
      - name: Scan the complete Git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .
