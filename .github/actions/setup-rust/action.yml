name: Set up Rust
description: Install a job-local Rust toolchain with the official rustup installer
inputs:
  toolchain:
    description: Rust toolchain channel or version to install
    required: true
  components:
    description: Comma-separated Rust components to install
    required: false
    default: ''
  target:
    description: Comma-separated Rust target triples to install
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install the requested Rust toolchain
      shell: bash
      env:
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_TARGETS: ${{ inputs.target }}
      run: bash "${{ github.action_path }}/setup.sh"
