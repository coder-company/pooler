# Safe production layout seed. The dashboard replaces this canonical file
# atomically after provider/account enrollment; no plaintext provider secret is
# required to start the loopback-only control plane.
version: 2

listeners:
  inference:
    bind: 127.0.0.1:18400

management:
  bind: 127.0.0.1:18401
  auth:
    secret: file:/etc/pooler/management.key
