  - {id: gateway-files-create, merge: true, downstream_auth: {secret: file:/run/secrets/downstream.key}}
  - {id: gateway-files-content, merge: true, downstream_auth: {secret: file:/run/secrets/downstream.key}}
  - {id: gateway-files-resource, merge: true, downstream_auth: {secret: file:/run/secrets/downstream.key}}
  - {id: gateway-batches-list, merge: true, downstream_auth: {secret: file:/run/secrets/downstream.key}}
