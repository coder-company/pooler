# Production container baseline. Replace the mounted file with a deployment-
# specific configuration when you need another provider or route plan.
#
# The gateway listener binds all container interfaces so Docker can publish it;
# management stays loopback-only and is used only by the in-container health
# check. The provider key is mounted as a file at runtime and is never stored
# in this YAML. Every generated gateway route also requires the separate
# downstream bearer file, so publishing the host port never creates an
# unauthenticated inference endpoint.
imports:
  - preset: gateway
    as: gateway
    with:
      provider: openai
      bind: 0.0.0.0:8400
      upstream_url: https://api.openai.com
      websocket_url: wss://api.openai.com
      secret: file:/run/secrets/upstream.key

version: 1

management:
  bind: 127.0.0.1:18477

# The gateway preset has many routes. Merge one owner-private downstream
# bearer reference into each generated route before compilation. `merge: true`
# is intentional: route IDs are generated as `gateway-<route-id>` by the
# preset loader.
routes:
  - {id: gateway-models, merge: true, downstream_auth: {secret: file:/run/secrets/downstream.key}}
  - {id: gateway-chat-completions, merge: true, downstream_auth: {secret: file:/run/secrets/downstream.key}}
  - {id: gateway-completions, merge: true, downstream_auth: {secret: file:/run/secrets/downstream.key}}
  - {id: gateway-embeddings, merge: true, downstream_auth: {secret: file:/run/secrets/downstream.key}}
