[package]
name = "pooler-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The Linux backend deliberately uses the kernel keyring only.  It never
# falls back to Secret Service, which can start an interactive unlock prompt
# in a headless daemon.  macOS and Windows use their native stores.
os-keyring = [
    "dep:keyring",
    "keyring/apple-native",
    "keyring/linux-native",
    "keyring/windows-native",
]

[dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
keyring = { workspace = true, optional = true }
pooler-core = { path = "../pooler-core" }
ring.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix.workspace = true

[lints]
workspace = true
