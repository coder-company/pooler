[package]
name = "pooler-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface for the Pooler protocol runtime"

[dependencies]
adapter-codex = { path = "../adapter-codex" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
# The shipped CLI should resolve keyring: references through the native OS
# credential store. pooler-auth keeps this feature opt-in for library users so
# cross-platform consumers can still choose their own backend.
pooler-auth = { path = "../pooler-auth", features = ["os-keyring"] }
pooler-config = { path = "../pooler-config" }
pooler-http = { path = "../pooler-http" }
pooler-model-catalog = { path = "../pooler-model-catalog" }
pooler-extension = { path = "../pooler-extension" }
pooler-observe = { path = "../pooler-observe" }
pooler-store = { path = "../pooler-store" }
pooler-server = { path = "../pooler-server" }
pooler-testkit = { path = "../pooler-testkit" }
rusqlite.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
rustix.workspace = true
tempfile.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
http.workspace = true

[lib]
name = "pooler_cli"
path = "src/lib.rs"

[[bin]]
name = "pooler"
path = "src/main.rs"

[lints]
workspace = true
