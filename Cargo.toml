[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/coder-company/pooler"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
base64 = "0.22"
bytes = "1.10"
clap = { version = "=4.6.6", features = ["derive"] }
flate2 = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1.2"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "http2", "server"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
indexmap = { version = "=2.14.0", features = ["serde"] }
keyring = { version = "=3.6.3", default-features = false }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
ring = "0.17"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
# Keep the existing local API name while using the maintained serde_yaml_ng
# fork. The old serde_yml crate is archived and has a RustSec unsoundness
# advisory.
serde_yml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tempfile = "=3.27.0"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.12", features = ["serde", "v4"] }
wasmtime = { version = "=36.0.13", default-features = false, features = ["cranelift", "runtime", "wat"] }
wat = "1.226.0"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
