[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://github.com/coder-company/pooler"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
bytes = "1.10"
clap = { version = "=4.5.23", features = ["derive"] }
http = "1.2"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "server"] }
hyper-rustls = { version = "=0.27.6", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
indexmap = { version = "=2.7.0", features = ["serde"] }
rustix = { version = "0.38", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.12", features = ["serde", "v4"] }
zeroize = "=1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
